<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Association Chat</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background:#0b6623;
    color:white;
    padding:15px;
    display:flex;
    align-items:center;
    gap:15px;
}

header button{
    background:white;
    color:#0b6623;
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
}

#onlineMembers{
    background:#fff;
    padding:10px;
    border-bottom:1px solid #ddd;
    font-size:14px;
}

#chatMessages{
    height:65vh;
    overflow-y:auto;
    padding:15px;
}

.chatInput{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:white;
    display:flex;
    padding:10px;
    gap:10px;
    box-shadow:0 -2px 10px rgba(0,0,0,.1);
}

.chatInput input{
    flex:1;
    padding:12px;
    border-radius:25px;
    border:1px solid #ccc;
}

.chatInput button{
    padding:12px 20px;
    border:none;
    border-radius:25px;
    background:#0b6623;
    color:white;
}

.chat-row{display:flex;gap:8px;align-items:flex-end;margin:10px 0}.chat-row.mine{justify-content:flex-end}.chat-row.theirs{justify-content:flex-start}.chat-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#ddd;flex:none}.chat-avatar-fallback{display:flex;align-items:center;justify-content:center;font-weight:bold;color:#0b6623}.chat-bubble{display:inline-block;background:#fff;padding:10px 12px;border-radius:14px;max-width:min(80%,520px);box-shadow:0 1px 3px rgba(0,0,0,.08)}.mine .chat-bubble{background:#dcf8c6}.chat-name{font-weight:700;font-size:13px;margin-bottom:4px}.chat-text{word-break:break-word;white-space:normal}.chat-meta{font-size:10px;opacity:.55;margin-top:6px}.message-actions{display:flex;gap:6px;margin-top:7px}.message-actions button{border:0;background:transparent;font-size:11px;cursor:pointer;padding:2px 4px}.message-actions .danger{color:#b00020}.chat-empty{text-align:center;opacity:.6;padding:40px 10px}.chatInput button:disabled{opacity:.6;cursor:not-allowed}
</style>

<link rel="stylesheet" href="rihula-modern-design.css">
<link rel="stylesheet" href="rihula-v3-ui.css">
</head>

<body>

<header>

<button onclick="history.back()">⬅ Back</button>

<h2>Association Chat</h2>

</header>

<div id="onlineMembers">

</div>

<div id="chatMessages">
</div>

<div class="chatInput">

<input
id="chatMessage"
placeholder="Type a message...">

<button onclick="sendMessage()">
Send
</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'"></script>
<script src="supabase.js?v=20260826-0835"></script>
<script src="rihula-db-guard.js?v=20260826-0835"></script>
<script src="chat.js?v=20260826-0835"></script>
<script src="popups.js?v=20260826-0835"></script>

<script src="v22.js?v=20260826-0835"></script>
<script src="rihula-v3-ui.js?v=20260826-0835"></script>
</body>
</html>
