<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | RIHULA</title>

    <!-- IMPORTANT: use the new auth CSS -->
    <link rel="stylesheet" href="auth-pages.css">
<link rel="stylesheet" href="rihula-modern-design.css">
<link rel="stylesheet" href="rihula-v3-ui.css">
</head>

<body class="auth-page">

    <div class="auth-wrapper">

        <main class="auth-card">

            <!-- Logo -->
            <img
                src="images/logo.jpg"
                class="auth-logo"
                alt="RIHULA Mukhobola Youths Association"
            >

            <!-- Header -->
            <header class="auth-header">

                <h1>🔐 Forgot Password?</h1>

                <p>
                    Enter the email address connected to
                    your RIHULA account and we will send
                    you a secure password reset link.
                </p>

            </header>


            <!-- Information -->
            <div class="auth-info">

                <span class="auth-info-icon">ℹ️</span>

                <div>
                    If you are an older member without an
                    activated email account, please contact
                    the RIHULA administrator for assistance.
                </div>

            </div>


            <!-- Reset form -->
            <form
                class="auth-form"
                id="forgotPasswordForm"
            >

                <div class="form-field">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                    id="resetButton"
                >
                    Send Reset Link
                </button>

            </form>


            <!-- Login -->
            <div class="auth-footer">

                Remember your password?

                <a href="login.html">
                    Login
                </a>

            </div>


            <div style="text-align:center;">

                <a
                    href="login.html"
                    class="back-link"
                >
                    ← Back to Login
                </a>

            </div>

        </main>

    </div>


    <!-- Scripts -->
    <script src="popups.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <script>

        const form =
            document.getElementById(
                "forgotPasswordForm"
            );

        const button =
            document.getElementById(
                "resetButton"
            );


        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();


                if (!email) {

                    showPopup(
                        "Please enter your email address.",
                        "warning"
                    );

                    return;
                }


                if (!email.includes("@")) {

                    showPopup(
                        "Please enter a valid email address.",
                        "warning"
                    );

                    return;
                }


                button.disabled = true;

                button.classList.add(
                    "button-loading"
                );

                button.textContent =
                    "Sending";


                try {

                    const redirectTo =
                        new URL(
                            "reset-password.html",
                            window.location.href
                        ).href;


                    const {
                        error
                    } =
                        await db.auth
                            .resetPasswordForEmail(
                                email,
                                {
                                    redirectTo:
                                        redirectTo
                                }
                            );


                    if (error) {
                        throw error;
                    }


                    /*
                     * Do not reveal whether an email
                     * actually exists.
                     */

                    showPopup(
                        "If an account exists with this email, " +
                        "a password reset link has been sent. " +
                        "Please check your email.",
                        "success"
                    );


                    form.reset();


                } catch (error) {

                    console.error(
                        "PASSWORD RESET ERROR:",
                        error
                    );


                    showPopup(
                        error.message ||
                        "Unable to send the reset email.",
                        "error"
                    );


                } finally {

                    button.disabled = false;

                    button.classList.remove(
                        "button-loading"
                    );

                    button.textContent =
                        "Send Reset Link";

                }

            }
        );

    </script>

<script src="rihula-v3-ui.js"></script>
</body>
</html>
