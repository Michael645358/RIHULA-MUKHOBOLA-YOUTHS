<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | RIHULA</title>
<link rel="stylesheet" href="auth-pages.css">
<link rel="stylesheet" href="rihula-modern-design.css">
<link rel="stylesheet" href="rihula-v3-ui.css">
</head>
<body class="auth-page">
<div class="auth-wrapper">
<main class="auth-card">
<img src="images/logo.jpg" class="auth-logo" alt="RIHULA Mukhobola Youths Association">
<header class="auth-header">
<h1>🔐 Forgot Password</h1>
<p>Enter the email address registered to your RIHULA account.</p>
</header>
<div class="auth-info"><span class="auth-info-icon">ℹ️</span><div>A secure password-reset link will be sent to your email.</div></div>
<form class="auth-form" id="forgotPasswordForm">
<div class="form-field">
<label for="email">Email address</label>
<input type="email" id="email" autocomplete="email" required placeholder="name@example.com">
</div>
<button type="submit" class="auth-button" id="resetButton">Send Reset Link</button>
</form>
<div class="auth-footer"><a href="login.html">← Back to Login</a></div>
</main>
</div>
<script src="popups.js?v=20260826-0835"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'"></script>
<script src="supabase.js?v=20260826-0835"></script>
<script src="rihula-db-guard.js?v=20260826-0835"></script>
<script>
(async function () {
  const form = document.getElementById("forgotPasswordForm");
  const button = document.getElementById("resetButton");
  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    const email = document.getElementById("email").value.trim().toLowerCase();
    if (!email) return;
    button.disabled = true;
    button.textContent = "Sending...";
    try {
  const redirectTo =
  new URL("reset-password.html", window.location.href).href;

const { error } =
  await db.auth.resetPasswordForEmail(email, {
    redirectTo: redirectTo
  });
      if (error) throw error;
      showPopup("If that email is registered, a secure password-reset link has been sent.", "success");
      form.reset();
    } catch (error) {
      console.error("PASSWORD RESET REQUEST:", error);
      showPopup(error.message || "Could not send the reset link.", "error");
    } finally {
      button.disabled = false;
      button.textContent = "Send Reset Link";
    }
  });
})();
</script>
<script src="rihula-v3-ui.js?v=20260826-0835"></script>
</body>
</html>
