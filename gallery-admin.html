<style>
.gallery-admin-wrap{max-width:1180px;margin:0 auto;padding:24px}.gallery-admin-hero,.gallery-admin-panel{background:rgba(255,255,255,.92);border:1px solid rgba(15,107,79,.12);border-radius:24px;padding:22px;box-shadow:0 12px 30px rgba(0,0,0,.06);margin-bottom:18px}.gallery-admin-hero h2{margin:0 0 8px}.gallery-admin-muted{color:#66736f;margin:0}.gallery-upload-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}.gallery-upload-btn{border:0;border-radius:14px;padding:13px 18px;background:#0f6b4f;color:#fff;font-weight:700;cursor:pointer}.gallery-admin-status{min-height:20px;color:#66736f}.gallery-admin-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.gallery-admin-item{overflow:hidden;border:1px solid #e2ebe7;border-radius:18px;background:#fff}.gallery-admin-item img{width:100%;height:190px;object-fit:cover;display:block}.gallery-admin-item-body{padding:14px}.gallery-admin-item-body strong{display:block}.gallery-admin-item-body small{display:block;color:#71807b;margin:6px 0 12px}.gallery-admin-actions{display:flex;gap:8px}.gallery-admin-btn{border:1px solid #d8e3df;background:#f8fbfa;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}.gallery-admin-btn.danger{color:#a02d2d}.gallery-admin-empty{padding:24px;border:1px dashed #cbdad4;border-radius:16px;text-align:center;color:#66736f}.gallery-admin-empty.error{color:#a02d2d}
</style>
</head>

<header class="admin-topbar"><button type="button" class="admin-menu-btn" onclick="toggleAdminSidebar()" aria-label="Open menu">☰</button><div class="admin-page-heading"><span class="admin-eyebrow">RIHULA MUKHOBOLA ASSOCIATION</span><h1>Gallery Manager</h1></div></header>
<main class="gallery-admin-wrap">
<section class="gallery-admin-hero"><h2>Manage Photo Gallery</h2><p class="gallery-admin-muted">Upload new photos, replace old ones, or remove photos. Changes appear on the public Gallery page.</p><div class="gallery-upload-row"><input id="galleryUploadInput" type="file" accept="image/*" multiple hidden><button id="galleryUploadButton" class="gallery-upload-btn" type="button">＋ Upload Photos</button><span id="galleryAdminStatus" class="gallery-admin-status"></span></div></section>
<section class="gallery-admin-panel"><div id="adminGalleryList" class="gallery-admin-list"></div></section>
</main>
