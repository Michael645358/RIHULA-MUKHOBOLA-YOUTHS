<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create New Password | RIHULA</title>
<link rel="stylesheet" href="auth-pages.css">
<link rel="stylesheet" href="rihula-modern-design.css">
<link rel="stylesheet" href="rihula-v3-ui.css">
</head>
<body class="auth-page">
<div class="auth-wrapper">
<main class="auth-card">
<img src="images/logo.jpg" class="auth-logo" alt="RIHULA Mukhobola Youths Association">
<header class="auth-header">
<h1>🔐 Create New Password</h1>
<p>Choose a new password for your RIHULA account.</p>
</header>
<div class="auth-info" id="resetStatus" role="status"><span class="auth-info-icon">🔄</span><div>Checking your secure reset session…</div></div>
<form class="auth-form" id="resetPasswordForm" hidden>
<div class="form-field"><label for="newPassword">New Password</label><input type="password" id="newPassword" autocomplete="new-password" minlength="8" required></div>
<div class="form-field"><label for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required></div>
<button type="submit" class="auth-button" id="savePasswordButton">Save New Password</button>
</form>
<div class="auth-footer"><a href="login.html">← Back to Login</a></div>
</main>
</div>
<script src="popups.js?v=20260826-0835"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'"></script>
<script src="supabase.js?v=20260826-0835"></script>
<script src="rihula-db-guard.js?v=20260826-0835"></script>
<script>
(async function () {
  const status = document.getElementById("resetStatus");
  const form = document.getElementById("resetPasswordForm");
  const button = document.getElementById("savePasswordButton");

  function setStatus(message, icon = "ℹ️") {
    status.innerHTML = '<span class="auth-info-icon">' + icon + '</span><div>' + message + '</div>';
  }

  try {
    const { data, error } = await db.auth.getSession();
    if (error) throw error;
    if (!data?.session) throw new Error("This password-reset link is missing or has expired. Please request a new one.");
    form.hidden = false;
    setStatus("Your secure reset session is ready. Enter your new password.", "✅");
  } catch (error) {
    console.error("RESET SESSION:", error);
    setStatus(error.message || "Password reset session is not available.", "⚠️");
    return;
  }

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    if (newPassword.length < 8) { showPopup("New password must contain at least 8 characters.", "warning"); return; }
    if (newPassword !== confirmPassword) { showPopup("The passwords do not match.", "warning"); return; }
    button.disabled = true;
    button.textContent = "Saving...";
    try {
      const { error } = await db.auth.updateUser({ password: newPassword });
      if (error) throw error;
      await db.auth.signOut();
      setStatus("Password updated successfully. You can now log in with your new password.", "✅");
      form.hidden = true;
      showPopup("Password updated successfully.", "success");
      setTimeout(() => window.location.href = "login.html", 1200);
    } catch (error) {
      console.error("RESET PASSWORD:", error);
      showPopup(error.message || "Could not update your password.", "error");
    } finally {
      button.disabled = false;
      button.textContent = "Save New Password";
    }
  });
})();
</script>
<script src="rihula-v3-ui.js?v=20260826-0835"></script>
</body>
</html>
