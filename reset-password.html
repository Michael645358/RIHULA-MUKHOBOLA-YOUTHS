<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create New Password | RIHULA</title>
<link rel="stylesheet" href="auth-pages.css">
<link rel="stylesheet" href="rihula-modern-design.css">
<link rel="stylesheet" href="rihula-v3-ui.css">
</head>
<body class="auth-page">
<div class="auth-wrapper">
<main class="auth-card">
<img src="images/logo.jpg" class="auth-logo" alt="RIHULA Mukhobola Youths Association">
<header class="auth-header">
<h1>🔐 Create New Password</h1>
<p>Enter and confirm your new RIHULA account password.</p>
</header>
<div class="auth-info" id="resetStatus" role="status">
<span class="auth-info-icon">🔄</span>
<div>Checking your secure password-reset session…</div>
</div>
<form class="auth-form" id="resetPasswordForm" hidden>
<div class="form-field">
<label for="newPassword">New Password</label>
<input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password" minlength="6" required>
</div>
<div class="form-field">
<label for="confirmPassword">Confirm Password</label>
<input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password" minlength="6" required>
</div>
<button type="submit" class="auth-button" id="savePasswordButton">Save New Password</button>
</form>
<div class="auth-footer"><a href="login.html">← Back to Login</a></div>
</main>
</div>
<script src="popups.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
(function () {
    const form = document.getElementById('resetPasswordForm');
    const status = document.getElementById('resetStatus');
    const button = document.getElementById('savePasswordButton');
    let recoveryReady = false;
    let handlingRecovery = false;

    function setStatus(message, type) {
        status.innerHTML = '<span class="auth-info-icon">' + (type === 'error' ? '⚠️' : type === 'success' ? '✅' : '🔄') + '</span><div>' + message + '</div>';
    }

    function showError(message) {
        setStatus(message, 'error');
        form.hidden = true;
    }

    async function prepareRecoverySession() {
        if (handlingRecovery || recoveryReady) return;
        handlingRecovery = true;

        try {
            // Supabase Auth consumes the access/refresh tokens from the recovery URL.
            // Wait for PASSWORD_RECOVERY when it is emitted, then verify the session.
            const { data: sessionData, error: sessionError } = await db.auth.getSession();
            if (sessionError) throw sessionError;

            if (sessionData && sessionData.session) {
                recoveryReady = true;
                form.hidden = false;
                setStatus('Your secure reset session is ready. Choose a new password.', 'success');
                return;
            }

            // Give the Supabase client a moment to process the URL hash.
            setTimeout(async function () {
                try {
                    const { data, error } = await db.auth.getSession();
                    if (error) throw error;
                    if (data && data.session) {
                        recoveryReady = true;
                        form.hidden = false;
                        setStatus('Your secure reset session is ready. Choose a new password.', 'success');
                    } else {
                        showError('This password-reset link is missing or has expired. Please request a new reset link.');
                    }
                } catch (error) {
                    console.error('RESET SESSION ERROR:', error);
                    showError('We could not verify this reset link. Please request a new one.');
                }
            }, 700);
        } catch (error) {
            console.error('RESET SESSION ERROR:', error);
            showError('We could not verify this reset link. Please request a new one.');
        }
    }

    db.auth.onAuthStateChange(function (event, session) {
        if (event === 'PASSWORD_RECOVERY' && session) {
            recoveryReady = true;
            form.hidden = false;
            setStatus('Your secure reset session is ready. Choose a new password.', 'success');
        }
    });

    form.addEventListener('submit', async function (event) {
        event.preventDefault();

        if (!recoveryReady) {
            showPopup('Your reset session is not ready. Please open the link from your email again.', 'warning');
            return;
        }

        const password = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;

        if (password.length < 6) {
            showPopup('Password must be at least 6 characters.', 'warning');
            return;
        }
        if (password !== confirm) {
            showPopup('Passwords do not match.', 'warning');
            return;
        }

        button.disabled = true;
        button.textContent = 'Saving…';

        try {
            const { error } = await db.auth.updateUser({ password: password });
            if (error) throw error;

            await db.auth.signOut();
            setStatus('Password updated successfully. Redirecting you to login…', 'success');
            form.reset();

            setTimeout(function () {
                window.location.replace('login.html?reset=success');
            }, 1200);
        } catch (error) {
            console.error('PASSWORD UPDATE ERROR:', error);
            showPopup(error.message || 'Could not update your password. Please request a new reset link.', 'error');
            button.disabled = false;
            button.textContent = 'Save New Password';
        }
    });

    prepareRecoverySession();
})();
</script>
<script src="rihula-v3-ui.js"></script>
</body>
</html>
