<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="rihula-modern-design.css">
<link rel="stylesheet" href="rihula-v3-ui.css">
</head>
<body>

<header>

<div class="logo-area">

<img src="images/logo.jpg" alt="Logo">

<div>
<h1>Announcements</h1>
<p>RIHULA MUKHOBOLA ASSOCIATION</p>
</div>

</div>

</header>

<section class="admin-panel">

<!-- Post Announcement -->
<div class="admin-card">

<h2>Post Announcement</h2>

<input
type="text"
id="announcementTitle"
placeholder="Announcement Title">

<textarea
id="announcementMessage"
placeholder="Announcement Message"></textarea>

<button
class="btn"
onclick="addAnnouncement()">
Post Announcement
</button>

</div>

<!-- Send Notification -->
<div class="admin-card">

<h2>Send Notification</h2>

<input
type="text"
id="notificationTitle"
placeholder="Notification Title">

<textarea
id="notificationMessage"
placeholder="Notification Message"></textarea>

<button
class="btn"
onclick="sendNotification()">
Send Notification
</button>

</div>

<!-- Existing Announcements -->
<div class="admin-card">

<h2>Manage Announcements</h2>

<div id="announcementsList">
<p></p>
</div>

<br>

<button
class="btn"
onclick="location.href='admin.html'">
← Back to Dashboard
</button>

</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'"></script>
<script src="supabase.js?v=20260826-0835"></script>
<script src="rihula-db-guard.js?v=20260826-0835"></script>
<script src="admin-auth.js?v=20260827-activity"></script>
<script>
document.documentElement.style.visibility = "hidden";
document.addEventListener("DOMContentLoaded", async () => { const admin = await RihulaAdmin.requireAdmin(); if (admin) document.documentElement.style.visibility = "visible"; });
</script>
<script src="script.js?v=20260826-0835"></script>

<script>
// Announcements page functions.
// Kept local to this page so it does not depend on the Admin Dashboard script.
async function loadAnnouncementsList() {
    const container = document.getElementById("announcementsList");
    if (!container) return;

    container.innerHTML = "<p>Loading announcements...</p>";

    const { data, error } = await db
        .from("announcements")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        console.error("RIHULA announcements load failed:", error);
        container.innerHTML = "<p>Could not load announcements.</p>";
        if (typeof showPopup === "function") showPopup(error.message, "error");
        return;
    }

    if (!data || data.length === 0) {
        container.innerHTML = "<p>No announcements yet.</p>";
        return;
    }

    container.innerHTML = data.map(item => `
        <div class="card announcement">
            <h3>${escapeAnnouncementText(item.title)}</h3>
            <p>${escapeAnnouncementText(item.message)}</p>
            <small>${item.created_at ? new Date(item.created_at).toLocaleString() : ""}</small>
            <br><br>
            <button class="btn" type="button" onclick="deleteAnnouncement(${Number(item.id)})">Delete</button>
        </div>
    `).join("");
}

function escapeAnnouncementText(value) {
    const div = document.createElement("div");
    div.textContent = value ?? "";
    return div.innerHTML;
}

async function addAnnouncement() {
    const titleEl = document.getElementById("announcementTitle");
    const messageEl = document.getElementById("announcementMessage");
    const title = titleEl?.value.trim() || "";
    const message = messageEl?.value.trim() || "";

    if (!title || !message) {
        if (typeof showPopup === "function") showPopup("Please enter both a title and a message.", "warning");
        return;
    }

    const { error } = await db.from("announcements").insert([{ title, message }]);

    if (error) {
        console.error("RIHULA announcement save failed:", error);
        if (typeof showPopup === "function") showPopup(error.message, "error");
        return;
    }

    titleEl.value = "";
    messageEl.value = "";
    if (typeof showPopup === "function") showPopup("Announcement posted successfully.", "success");
    await loadAnnouncementsList();
}

async function deleteAnnouncement(id) {
    const confirmed = await showConfirm("Delete this announcement? This action cannot be undone.", {
        title: "Delete announcement",
        confirmText: "Delete",
        danger: true
    });

    if (!confirmed) return;

    const { error } = await db.from("announcements").delete().eq("id", id);

    if (error) {
        console.error("RIHULA announcement delete failed:", error);
        if (typeof showPopup === "function") showPopup(error.message, "error");
        return;
    }

    if (typeof showPopup === "function") showPopup("Announcement deleted successfully.", "success");
    await loadAnnouncementsList();
}

async function sendNotification() {
    const titleEl = document.getElementById("notificationTitle");
    const messageEl = document.getElementById("notificationMessage");
    const title = titleEl?.value.trim() || "";
    const message = messageEl?.value.trim() || "";

    if (!title || !message) {
        if (typeof showPopup === "function") showPopup("Please enter both a title and a message.", "warning");
        return;
    }

    const { error } = await db.from("notifications").insert([{ title, message }]);

    if (error) {
        console.error("RIHULA notification save failed:", error);
        if (typeof showPopup === "function") showPopup(error.message, "error");
        return;
    }

    titleEl.value = "";
    messageEl.value = "";
    if (typeof showPopup === "function") showPopup("Notification saved successfully.", "success");
}

document.addEventListener("DOMContentLoaded", () => {
    loadAnnouncementsList();
});
</script>

<script src="popups.js?v=20260826-0835"></script>

<script src="v22.js?v=20260826-0835"></script>
<script src="rihula-v3-ui.js?v=20260826-0835"></script>
</body>
</html>
